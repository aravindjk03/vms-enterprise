# VMS Enterprise: PostgreSQL + migrations + API/web console.
#
#   cp .example.env .env   # then set the four secrets below
#   docker compose up -d --build
#   open http://localhost:8080
#
# Required in .env: POSTGRES_PASSWORD, APP_DB_PASSWORD, JWT_SECRET, EPASS_SIGNING_SECRET

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vms_enterprise_db
      POSTGRES_USER: vms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms_owner -d vms_enterprise_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations and (re)creates the RLS-restricted runtime role.
  migrate:
    build: .
    image: vms-enterprise:latest
    command: ["node", "--import", "tsx", "packages/database/scripts/migrate.ts", "--create-app-user"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://vms_owner:${POSTGRES_PASSWORD}@db:5432/vms_enterprise_db
      APP_DB_USER: vms_api
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: vms-enterprise:latest
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vms_api:${APP_DB_PASSWORD}@db:5432/vms_enterprise_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EPASS_SIGNING_SECRET: ${EPASS_SIGNING_SECRET:?set EPASS_SIGNING_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-100}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
